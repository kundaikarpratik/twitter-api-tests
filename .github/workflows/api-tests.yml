name: Twitter API Tests CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Twitter API Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install Newman and Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-html
          npm install -g newman-reporter-htmlextra
      
      - name: Start Twitter Mock Server
        run: |
          node twitter-mock-server-standalone.js &
          echo $! > server.pid
          sleep 3
          curl http://localhost:3000/v2/users/analytics || exit 1
        continue-on-error: false
      
      - name: Create Reports Directory
        run: mkdir -p reports
      
      - name: Run API Tests
        run: |
          newman run twitter-platform-tests.json \
            --env-var "baseUrl=http://localhost:3000" \
            --reporters cli,html,htmlextra,json \
            --reporter-html-export reports/test-report.html \
            --reporter-htmlextra-export reports/test-report-extra.html \
            --reporter-json-export reports/test-results.json \
            --bail \
            --color on
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 30
      
      - name: Stop Mock Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      - name: Parse Test Results
        if: always()
        run: |
          echo "## 🐦 Twitter API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get assertion counts (actual test validations)
          TOTAL_ASSERTIONS=$(jq '.run.stats.assertions.total' reports/test-results.json)
          FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' reports/test-results.json)
          PASSED_ASSERTIONS=$((TOTAL_ASSERTIONS - FAILED_ASSERTIONS))
          
          # Get request counts
          TOTAL_REQUESTS=$(jq '.run.stats.requests.total' reports/test-results.json)
          FAILED_REQUESTS=$(jq '.run.stats.requests.failed' reports/test-results.json)
          
          # Calculate success rate
          SUCCESS_RATE=$(echo "scale=2; ($PASSED_ASSERTIONS/$TOTAL_ASSERTIONS)*100" | bc)
          
          echo "### 🧪 Test Assertions" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Assertions:** $TOTAL_ASSERTIONS" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** ✅ $PASSED_ASSERTIONS" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** ❌ $FAILED_ASSERTIONS" >> $GITHUB_STEP_SUMMARY
          echo "- **Success Rate:** ${SUCCESS_RATE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📡 API Requests" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Requests:** $TOTAL_REQUESTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Requests:** $FAILED_REQUESTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- POST /v2/tweets (8 assertions)" >> $GITHUB_STEP_SUMMARY
          echo "- GET /v2/users/by/username/{username}/tweets (8 assertions)" >> $GITHUB_STEP_SUMMARY
          echo "- GET /v1.1/trends/place.json (7 assertions)" >> $GITHUB_STEP_SUMMARY
          echo "- GET /v2/users/analytics (7 assertions)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED_ASSERTIONS" -gt 0 ]; then
            echo "❌ **Status:** Tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Status:** All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
